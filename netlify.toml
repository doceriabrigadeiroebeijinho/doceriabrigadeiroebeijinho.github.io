headersOrigin = "inline"
redirectsOrigin = "inline"

[functions]

  [functions."*"]
  node_bundler = "esbuild"

[[plugins]]
origin = "default"
package = "@netlify/plugin-nextjs"

  [plugins.inputs]

[build]
publish = "/workspace/sites/doceria-brigadeiro-beijinho/.next"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build:netlify"

  [build.environment]
  NODE_VERSION = "22.18.0"
  NEXT_TELEMETRY_DISABLED = "1"

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/_next/static/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/_next/image"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200
force = false

  [redirects.query]
  url = ":url"
  w = ":width"
  q = ":quality"

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/_ipx/*"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200
force = false

  [redirects.query]
  url = ":url"
  w = ":width"
  q = ":quality"

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/_next/image"
to = "/.netlify/images"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]